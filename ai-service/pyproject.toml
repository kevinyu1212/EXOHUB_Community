[project]
name = "exohub-ai-service"
version = "0.1.0"
description = "EXOHUB AI service for specimen/taxon valuation and market price forecasting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2.10.3",
  "numpy>=2.2.1",
  "pandas>=2.2.3",
  "scipy>=1.14.1",
  "scikit-learn>=1.6.0",
  "lightgbm>=4.5.0",
  "statsmodels>=0.14.4",
  "joblib>=1.4.2",
  "httpx>=0.28.1"
]